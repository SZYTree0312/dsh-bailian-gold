# 阿里云百炼（DashScope）route 配置 —— 配套 presets/bailian-gold.patch.yml
#
# ⚠️ 本文件是**备选**。百炼成金 preset 配套的是 Anthropic 端点那条路：
#    examples/aliyun-anthropic-route.patch.yml
#    走它才能拿到 cache_control 显式缓存断点（命中按 1 折 ¥0.08/M 计费，
#    而本文件的 OpenAI 壳只有隐式缓存、命中 2 折 ¥0.16/M）。
#    仅当你确实需要兼容模式独有的模型时才用这份。
#
# 这段属于 Host 级配置（profile 的 cordis.patch.yml），不是 preset 的一部分。
# 二者分工：preset 定义 agent 行为（工具面 / 提示词 / 压缩策略），
# 这里定义模型容量。压缩的实际触发点由两者共同决定。
#
# 为什么 contextWindow 是这里最要紧的一个数：
#   compaction-basic 的触发点是
#       min(contextWindow × thresholdRatio, messageBudget − headroomTokens)
#   其中 messageBudget = contextWindow − 每请求输出预留。
#   窗口小于约 300K 时，真正生效的是右边那一项 —— thresholdRatio 会被架空虚设。
#   例：contextWindow 262144、输出预留 32768、headroom 65536
#       → 触发点 163840，而不是 262144 × 0.92 = 241172。
#
#   Qwen3.8-Flash 原生 262144，YaRN 可扩 1M，官方标准模式最大输入 991808。
#   把它开到 991808，触发点升到约 893504 —— 常规会话根本压不到，
#   前缀缓存也就不会因为一次 replace 而整体失效。这是本 harness 的核心收益所在。

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      aliyun:
        displayName: 阿里云百炼
        apiKeyEnv: ALIYUN_API_KEY
        api: openai-completions
        # 通用端口。若走阿里云专属 MaaS 实例，替换成
        # https://llm-<实例 id>.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
        baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
        models:
          # —— Qwen3.8 / Qwen4 架构（本 preset 的主目标）——
          - id: qwen3.8-flash
            name: qwen3.8-flash
            # 官方标准模式最大输入 991808（思考模式 983616）。
            # 这是「尽量不压缩」策略的前提。
            contextWindow: 991808
          # —— 老架构 Qwen3 系列 ——
          # 比例参数与窗口无关，但窗口本身必须如实填写：填大了压缩迟迟不触发、
          # 一路撞上限；填小了白白提高压缩频率。数字以百炼控制台为准，别照抄别家平台。
          # - id: qwen3-max
          #   name: qwen3-max
          #   contextWindow: <控制台公布的窗口>
          # —— 百炼托管的第三方模型 ——
          # DeepSeek / Kimi / GLM / MiniMax 在同一个 route 下同理声明。
          # 它们同样吃百炼的平台级隐式缓存，所以本 preset 的保前缀策略一并适用，
          # 不需要另做 preset。
          # - id: kimi-k3
          # - id: glm-5.3
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
        # 不设 model 的 maxTokens：留空则用 route 回退值 32768。
        # 注意设了它会同时成为每请求的输出默认值，反而把 messageBudget 压低、
        # 让压缩更早触发 —— 与本 preset 的目标相反。

# 阿里云百炼 · Anthropic 兼容端点方案
#
# 现状（examples/aliyun-route.patch.yml）走的是百炼的 OpenAI 兼容壳：
#   api: openai-completions
#   baseURL: .../compatible-mode/v1
# 那是一层协议翻译器——非标的 enable_thinking 要被拦成 HTTP header 才能透传，
# 思考内容以 reasoning_content 字段回流，工具调用走 OpenAI function call，
# 而且没有 prompt 缓存的显式标记位。
#
# 百炼另有一个 Anthropic 兼容端点，路径只差一段：
#   POST https://{WorkspaceId}.{region}.maas.aliyuncs.com/apps/anthropic/v1/messages
# 走它能换回：
#   - 原生 thinking / tool_use / tool_result 内容块（而非字段拼装）
#   - cache_control: {type: ephemeral} 显式缓存断点，命中后按缓存费率计费
#     （最小可缓存长度 1024 tokens；usage 回传 cache_creation_input_tokens /
#      cache_read_input_tokens，两个字段在 message_delta 事件里给全）
#   - stop_reason: tool_use 等规范语义
#
# ⭐ 但这条路的第一价值是省钱，不是「更接近原生」：
#
#   官方计费：隐式缓存命中 = 输入价 × 20%，创建 = 100%
#             显式缓存命中 = 输入价 × 10%，创建 = 125%
#
#   设一段 T token 的稳定前缀连续重复 N 轮：
#     隐式 = 1.00 + 0.20 × (N−1)
#     显式 = 1.25 + 0.10 × (N−1)     → 转折点 N ≥ 4
#
#   N=10 省 23%，N=50 省 43%，渐近上限 50%。
#   而百炼成金 preset 的全部设计就是「让同一段前缀每轮原样重发」——
#   正好落在显式缓存的最优区。编码会话动辄几十上百轮，第 4 轮轻松越过。
#
#   实测（2026-09-30，同一实例）：同一段 10391 token 前缀连发三次，
#   显式路径第 2、3 次 cache_read = 10377（覆盖 99.9%），
#   隐式路径 cached_tokens = 10240（覆盖 98.5%）。两边都通，显式更便宜也更干净。
#
#   代价：显式缓存有效期固定 5 分钟（命中后重置），隐式由系统不定期清理。
#   交互密集选显式；会话中间搁置很久的话，显式要按 125% 重建一次。
#   完整推算见 docs/verify-prefix-cache.md。
#
# 注意：连官方 DeepSeek adapter（packages/llm/llm-deepseek）都没有发 cache_control，
# 全库 grep 为空。它靠的是隐式前缀缓存 + in-history 保前缀。这里反过来——
# 显式断点由我们主动标，且 in-history **端点层也拿得到**（见文末实测，旧结论已更正）。
#
# ── 2026-10-04 端到端实测（公共端点 + qwen3.8-flash，真实 key）──────────────
#   ✅ 简单对话          —— 200，语义正常
#   ✅ 显式缓存          —— 前缀带 cache_control：轮1 create=3192 → 轮2/3 read=3192
#                          （历史从 19→50→73 token 递增，前缀照样命中）
#   ✅ 工具调用往返      —— 轮1 stop_reason=tool_use 返回规范的 tool_use 块；
#                          回传 tool_result 后轮2 end_turn，模型正确使用了结果
#   ✅ 多轮工具循环      —— 轮3 再次 tool_use，稳定
#   ✅ 思考块重放        —— 百炼返回的 thinking 块 signature 为空字符串 ""，
#                          原样重放进历史，后续轮次全部 200，端点不校验它
#   ✅ 关思考            —— thinking: {type:"disabled"} 生效
#   ✅ 公共端点即可      —— 不需要专属实例域名（缓存池跨端点共享）
#   ⚠️ 端点该给的都是给的；剩下的限制在 pi-ai 层（能力位 withhold），见文末。
# ─────────────────────────────────────────────────────────────────────────

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      aliyun:
        displayName: 阿里云百炼
        apiKeyEnv: ALIYUN_API_KEY
        # anthropic-messages 是 pi-ai 支持的三种协议之一
        api: anthropic-messages
        # 必须以 /apps/anthropic 结尾，不要带 /v1 ——客户端会自己拼 /v1/messages。
        #
        # ⭐ 2026-10-04 实测更正：这里**不需要**专属实例，公共端点直接可用。
        #   之前写 `{WorkspaceId}.cn-beijing.maas.aliyuncs.com` 是照抄官方文档的
        #   推荐形态，但实测表明 `dashscope.aliyuncs.com/apps/anthropic` 同样返回 200、
        #   显式缓存照常创建与命中（且缓存池跨端点共享：专属建的缓存，公共能读到）。
        #   官方推荐专属域名是为了性能与稳定性（独立配额/限流），不是能力门槛。
        #   所以默认写公共端点；撞 QPS 时再换成
        #   https://llm-<实例 id>.cn-beijing.maas.aliyuncs.com/apps/anthropic
        baseURL: https://dashscope.aliyuncs.com/apps/anthropic
        compat:
          # ⚠️ 2026-10-04 实测更正：这里原先写 `cacheControlFormat: anthropic` 是**错的**。
          #
          #   `cacheControlFormat` 属于 `OpenAICompletionsCompat`，只归 `openai-completions`
          #   协议所有。而 pi-ai 的规则是「字段只属于声明它的那个协议」：
          #     模型级不匹配的字段 → fails resolution；
          #     route 级不匹配的字段 → **skips past models it cannot fit**
          #     （静默跳过，不报错，也完全不生效）。
          #   所以配了等于没配，还让人误以为显式缓存是它打开的。
          #
          #   anthropic-messages 原生就会发 `cache_control`，**不需要**这个开关。
          #
          # anthropic-messages 真正可用的缓存相关位（见 catalog.d.ts）：
          supportsCacheControlOnTools: true
          #   在工具定义上也打 cache_control。实测端点接受（HTTP 200 不报错），
          #   但本次测试的工具目录太短、create=0 —— 实际是否产生缓存取决于
          #   工具目录总长度是否够到百炼的最小可缓存长度。agent 场景工具多，
          #   开着不亏；想确认收益就去看 usage.cache_creation_input_tokens。
          #
          # supportsLongCacheRetention: true   ← **不要开**。
          #   百炼给的是 ephemeral_5m（响应里 cache_creation.ephemeral_5m_input_tokens），
          #   只有 5 分钟，没有长保留档。
        # 手写 models：该端点不提供 /v1/models，自动发现会 404。
        # 模型 id 必须用百炼的写法（deepseek-v4-flash / deepseek-v4.1-flash / qwen3.8-flash …）
        models:
          - id: qwen3.8-flash
            name: qwen3.8-flash
            # ⚠️ 这一行不能省。省掉就回落 defaultContextWindow 262144，
            # 压缩触发点从 ~893504 掉到 163840 —— 常规会话够得着，
            # preset 的保前缀设计随之失效。
            contextWindow: 991808
            # qwen3.8-flash 在百炼上**默认开思考**，而 pi-ai 对未声明
            # reasoningEfforts 的模型判定为「不思考」、不发控制参数 ——
            # 结果是思考照跑照计费，却不在 harness 视野里（实测占输出 token 69%）。
            # 想把它变成可控项，声明推理等级：
            #
            # reasoningEfforts:      # 键 = 选择器等级，值 = 协议里发送的拼写
            #   off:                 # 只有 off 允许留空
            #   high: high
            # compat:
            #   thinkingFormat: qwen # 取值须在 pi-ai 的 THINKING_FORMAT_GATE 内
            #
            # ⭐ 2026-10-04 补测：**端点层**已验证 —— 发 `thinking: {type: "disabled"}`
            #   能关掉思考（回复变简洁、不再有 thinking 块），思考确为可控项。
            #
            #   ⚠️ 仍未验证的是**dsh 配置层**：`reasoningEfforts` → wire 参数的映射
            #   在 pi-ai 库内部，本仓库没有实机跑过 dsh。写错可能让每次请求都失败，
            #   先拿小请求试。
            #
            # 另外：思考块回流时 `signature` 是**空字符串**（百炼给的就是 ""）。
            #   实测把这个空 signature 的 thinking 块原样重放进历史，
            #   后续轮次（含再次 tool_use）全部 200 —— 端点不校验它。
            #   但 pi-ai 侧有 `allowEmptySignature` 位：不开的话它可能把 thinking
            #   转成 `<thinking>` 文本再重放，字节形态就变了。想保持前缀字节稳定，
            #   建议开 `allowEmptySignature: true`（dsh 侧行为未实测）。
            #
            # 关掉思考省的是输出 token，但 agent 少了推理容易多绕几轮
            # （每轮都付新内容全价）—— 是取舍，不是纯赚。
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash

# ⭐ 2026-10-04 实测更正：in-history 这条机制**在端点上通**。
#
# 之前这里写「百炼 Anthropic 文档明确写着 system 是顶层参数、messages 数组
# 不接受 system 角色，所以 in-history 拿不到」—— 那是照抄文档，没实测。
# 实际拿真实 key 打过去，两个实验都推翻了它：
#
#   实验A（谁优先）：顶层 system 要求含 AAA、messages 内 system 要求含 BBB
#     → 回复「这句话包含了标记 AAA 和 BBB」。不是覆盖，是**合并生效**。
#      messages 数组里的 system 角色被接受，且语义真的起作用。
#   实验B（保不保前缀）：固定长前缀带 cache_control，连续三轮，
#     每轮在**尾部**追加一条新 system（CCC2 / CCC3）再接新的 user：
#       轮1 create=1802 read=0
#       轮2 create=0   read=1802   回复含 CCC2 ✅
#       轮3 create=0   read=1802   回复含 CCC3 ✅
#     → 追加的 system 生效，而**前缀缓存一次没断**。
#
# 也就是说：动态状态可以追加在历史尾部更新系统提示，不必重写开头那条消息。
# 这正是 in-history 想要的效果，端点层面完全给得起。
#
# ⚠️ 但还有第二道关：pi-ai 层。它内部有 supportsMidConvoSystemMessages /
# supportsMidConvoToolAdditions 两个能力位，在 compat 表里是 'withhold'
# —— 不由用户配置，只能由 pi-ai 内置 catalog 的 provider 声明。
# 百炼是手申报路由，拿不到。上面两个实验是**直接发 HTTP** 验证的端点能力，
# 不代表 dsh 一定会这样组织请求。
#
# 所以当前策略（仍然成立，但理由变了）：把前缀稳定性交给 harness 侧 ——
# presets/bailian-gold.patch.yml 的三条设计（工具目录固定 / 历史只追加 /
# 动态状态推尾部）依旧是主力。不是因为端点不支持（支持），而是因为 pi-ai
# 的能力位不给配。若哪天这一位放开，或改用自己的 fork，尾部追加 system
# 这条路可以直接用起来，不必再靠 includeRuntimeContext: false 做全有全无的妥协。
